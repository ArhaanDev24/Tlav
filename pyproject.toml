[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tlav"
version = "0.1.0"
description = "Turn old PCs and laptops into local AI workstations: detect, benchmark, pick, compress and run the best model your hardware can handle."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []  # stdlib only, so it installs on old machines without compilers

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tlav = "tlav.cli:main"

[tool.setuptools]
packages = ["tlav"]

[tool.setuptools.package-data]
tlav = ["data/*.json", "data/*.txt"]
