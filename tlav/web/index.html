<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tlav</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%2313170f'/%3E%3Crect x='2' width='2' height='2' fill='%23f26b3a'/%3E%3C/svg%3E">
<style>
/* Tlav web chat. Served by llama-server from ~/.tlav/web; works fully offline (system fonts only). */
:root {
  --ease: cubic-bezier(.2, .7, .1, 1);
  --bg: #ffffff; --surface: #ffffff; --ink: #13170f; --muted: #5d6656; --line: #e4e9df;
  --soft: #f1f5ee; --deep: #24402c; --pixel: #f26b3a; --on-deep: #f3f6ee; --danger: #b3412b;
  --fx-a: #7aa886; --fx-b: #f26b3a;   /* background pixels */
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11150f; --surface: #171c15; --ink: #e9eee3; --muted: #9aa592; --line: #2a3226;
    --soft: #1f261c; --deep: #2f5a3b; --pixel: #f47a4c; --on-deep: #f3f6ee; --fx-a: #4f7a5a; --fx-b: #f47a4c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11150f; --surface: #171c15; --ink: #e9eee3; --muted: #9aa592; --line: #2a3226;
  --soft: #1f261c; --deep: #2f5a3b; --pixel: #f47a4c; --on-deep: #f3f6ee; --fx-a: #4f7a5a; --fx-b: #f47a4c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); display: flex; flex-direction: column; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pixel); outline-offset: 2px; }
.mark { width: 14px; height: 14px; flex: none; display: block; }
.mark .q { transition: transform .2s; }
@keyframes orbit { 0% { transform: translate(0, 0); } 25% { transform: translate(0, 2px); } 50% { transform: translate(-2px, 2px); } 75% { transform: translate(-2px, 0); } }
.moving .q { animation: orbit .64s steps(1) infinite; }

header { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -0.02em; font-size: 18px; }
.model { color: var(--muted); font: 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 0; font-size: 14px; min-height: 36px; }
.btn:hover { border-color: var(--ink); }
.btn.icon { width: 36px; padding: 0; display: inline-grid; place-items: center; }
.btn.icon svg { width: 15px; height: 15px; shape-rendering: crispEdges; }
.btn.icon .sun { display: none; }
.dark-now .btn.icon .sun { display: block; }
.dark-now .btn.icon .moon { display: none; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); user-select: none; }
.toggle input { accent-color: var(--pixel); width: 16px; height: 16px; }

main { flex: 1; overflow-y: auto; position: relative; z-index: 1; }
header, form { position: relative; z-index: 2; }
/* slow pixel field behind the conversation (decorative, paused for reduced motion) */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; }
.meta .live { color: var(--ink); }
.log { max-width: 780px; margin: 0 auto; padding: 24px 16px 8px; display: grid; gap: 18px; }
.empty { text-align: center; color: var(--muted); padding: 12vh 16px 0; }
.empty .mark { width: 36px; height: 36px; margin: 0 auto 14px; }
.empty h1 { color: var(--ink); font-size: 26px; letter-spacing: -0.03em; margin: 0 0 6px; }
.empty p { margin: 0 auto; max-width: 30em; }
.me { justify-self: end; max-width: 85%; background: var(--ink); color: var(--bg); padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ai { justify-self: start; max-width: 100%; display: grid; gap: 8px; min-width: 0; }
.head { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 20px; }
.head b { font-weight: 650; }
.head .verb { color: var(--muted); }
.head .secs { color: var(--muted); font: 12px var(--mono); }
.think { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding: 0 0 0 12px; }
.think summary { cursor: pointer; font-size: 13px; }
.think div { white-space: pre-wrap; margin-top: 6px; overflow-wrap: anywhere; }
.text { background: var(--soft); padding: 12px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.text:empty { display: none; }
.text { position: relative; padding-right: 48px; }
.text .copy { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px;
  border: 1px solid transparent; background: transparent; color: var(--muted); font: 12px var(--sans); cursor: pointer;
  opacity: 0; transition: opacity .2s, background-color .2s, border-color .2s, color .2s; }
.text .copy svg { width: 12px; height: 12px; shape-rendering: crispEdges; }
.text .copy .copy-label { max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .25s var(--ease); }
.text:hover .copy, .text .copy:focus-visible, .text .copy.done { opacity: 1; }
.text .copy:hover, .text .copy:focus-visible, .text .copy.done { background: var(--surface); border-color: var(--line); color: var(--ink); }
.text .copy:hover .copy-label, .text .copy:focus-visible .copy-label, .text .copy.done .copy-label { max-width: 90px; }
.text .copy.done { color: var(--deep); }
@media (hover: none) { .text .copy { opacity: .75; } }
.text code { font: .92em var(--mono); background: var(--bg); padding: 1px 5px; }
.text b { font-weight: 650; }
.pen { display: inline-block; width: 11px; height: 11px; margin-left: 5px; vertical-align: -1px; }
.meta { display: flex; gap: 12px; align-items: center; font: 12px var(--mono); color: var(--muted); }
.error { color: var(--danger); font-size: 14px; }
.note { max-width: 780px; margin: 0 auto; padding: 0 16px; font-size: 13px; color: var(--muted); }

form { background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 10px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* the message box: one card holding the text, a small footer and the send button */
.compose { position: relative; max-width: 780px; margin: 0 auto; display: flex; align-items: stretch; gap: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px -18px rgba(19, 23, 15, .35);
  transition: border-color .25s, box-shadow .35s, transform .35s var(--ease); }
.compose:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pixel) 22%, transparent), 0 16px 36px -20px rgba(19, 23, 15, .45); transform: translateY(-1px); }
.field { position: relative; flex: 1; min-width: 0; display: grid; }
textarea { grid-area: 1 / 1; resize: none; min-height: 52px; max-height: 40vh; padding: 15px 18px 6px; border: 0; background: transparent; border-radius: 0; line-height: 1.5; outline: none; }
textarea::placeholder { color: transparent; }
textarea:focus-visible { outline: none; }   /* the whole card shows focus instead */
.ghost { grid-area: 1 / 1; pointer-events: none; padding: 15px 18px 6px; line-height: 1.5; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .45s, transform .45s var(--ease); }
.ghost.out { opacity: 0; transform: translateY(-6px); }
.ghost.hide { display: none; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 18px 10px; font-size: 12px; color: var(--muted); }
.bar kbd { font: 11px var(--mono); padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--ink); }
.count { font: 11.5px var(--mono); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s; }
.count.on { opacity: 1; }
.send { position: relative; flex: none; width: 64px; margin: 8px; border: 0; border-radius: 11px; display: grid; place-items: center; gap: 2px;
  background: var(--soft); color: var(--muted); font: 600 11px var(--sans); letter-spacing: .02em; cursor: default;
  transition: background-color .25s, color .25s, transform .2s var(--ease); }
.send svg { width: 16px; height: 16px; shape-rendering: crispEdges; }
.send .stopmark { display: none; }
.send.ready { background: var(--ink); color: var(--bg); cursor: pointer; }
.send.ready:hover { transform: translateY(-2px); }
.send.ready .arrow { animation: nudge 1.6s var(--ease) infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-2px); } }
.send.stop { background: var(--pixel); color: #13170f; cursor: pointer; }
.send.stop .arrow { display: none; }
.send.stop .stopmark { display: block; }
.send.stop .stopmark .q { animation: orbit .64s steps(1) infinite; }
.send:active { transform: scale(.96); }
.hint { max-width: 780px; margin: 8px auto 0; font-size: 12px; color: var(--muted); display: flex; justify-content: center; gap: 12px; }
/* messages arrive with a little motion */
.me { animation: inR .45s var(--ease) both; }
.ai { animation: inUp .5s var(--ease) both; }
@keyframes inR { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes inUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.empty .mark rect { animation: pxin .5s var(--ease) both; }
.empty .mark rect.q { animation-delay: .35s; }
.empty h1, .empty p { animation: inUp .7s var(--ease) both; }
.empty h1 { animation-delay: .25s; } .empty p { animation-delay: .4s; }
@keyframes pxin { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.empty .mark rect { transform-box: fill-box; transform-origin: center; }

@media (max-width: 560px) {
  .keys { display: none; }
  .send { width: 52px; margin: 6px; }
  .model { display: none; }
  .me { max-width: 92%; }
  .hint span:last-child { display: none; }
  .btn, .send { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .moving .q, .send .q, .send .arrow, .me, .ai, .empty *, .compose, .ghost { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="mark" viewBox="0 0 4 4" aria-hidden="true"><rect width="4" height="4" fill="var(--ink)"/><rect class="q" x="2" width="2" height="2" fill="var(--pixel)"/></svg>Tlav</div>
  <div class="model" id="model">local model</div>
  <div class="tools">
    <label class="toggle" id="thinkWrap" hidden><input type="checkbox" id="think"> Reasoning</label>
    <button class="btn icon" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Dark or white"><svg viewBox="0 0 8 8" aria-hidden="true"><path class="moon" fill="currentColor" d="M3 0h3v1H4v1H3v4h1v1h2v1H3V7H2V6H1V2h1V1h1z"/><path class="sun" fill="currentColor" d="M3 0h2v1H3zM3 7h2v1H3zM0 3h1v2H0zM7 3h1v2H7zM2 2h4v4H2zM1 1h1v1H1zM6 1h1v1H6zM1 6h1v1H1zM6 6h1v1H6z"/></svg></button>
    <button class="btn" id="newChat" type="button">New chat</button>
  </div>
</header>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="scroller">
  <div class="log" id="log" aria-live="polite"></div>
</main>
<form id="form" autocomplete="off">
  <div class="compose" id="compose">
    <label for="input" class="sr">Message</label>
    <div class="field">
      <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <div class="bar"><span class="keys"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span><span class="count" id="count"></span></div>
    </div>
    <button class="send" id="send" type="submit" aria-label="Send"><svg class="arrow" viewBox="0 0 7 7" aria-hidden="true"><path fill="currentColor" d="M3 0h1v1H3zM2 1h3v1H2zM1 2h5v1H1zM0 3h7v1H0zM3 4h1v3H3z"/></svg><svg class="stopmark" viewBox="0 0 4 4" aria-hidden="true"><rect width="4" height="4" fill="currentColor"/><rect class="q" x="2" width="2" height="2" fill="#fbfcf9"/></svg><span class="label">Send</span></button>
  </div>
  <div class="hint"><span id="where">Offline · on this computer</span></div>
</form>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const MARK = '<rect width="4" height="4" fill="var(--ink)"/><rect class="q" x="2" width="2" height="2" fill="var(--pixel)"/>';
  const svg = (cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 4 4"); s.setAttribute("class", cls); s.setAttribute("aria-hidden", "true"); s.innerHTML = MARK; return s; };
  // Basic markdown for replies (models write **bold**, `code`, bullets and headings). Everything is
  // escaped first, so a reply can never inject HTML into the page.
  const md = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
    .replace(/^#{1,6} +(.+)$/gm, "<b>$1</b>")
    .replace(/^(\s*)[*-] +/gm, "$1• ")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Settings Tlav writes next to this page (tlav.json); sensible defaults if it is missing.
  let cfg = { model: "", quant: "", ctx: 4096, est_tps: 0, reasons: false, where: "this computer",
              verbs: ["Defragmenting the C: drive", "Warming up the CRT", "Counting to 640K", "Tlaving"] };
  const KEY = "tlav.chat.v1";
  let messages = [], busy = null, think = false, temperature = 0.7, fxBusy = false;
  const ripples = [];   // {x, y, t0, k}: a ring of brighter pixels spreading through the background
  const fxRipple = (x, y, k) => { if (!matchMedia("(prefers-reduced-motion: reduce)").matches) ripples.push({ x, y, t0: performance.now(), k }); };
  let restartHint = "Type `tlav` in a terminal to start it again.";

  // Each browser tab keeps its own conversation (two tabs never overwrite each other); a new tab
  // starts from a copy of the most recent one. Only the 10 most recent tab conversations are kept.
  let TAB = "";
  try { TAB = sessionStorage.getItem("tlav.tab") || ""; if (!TAB) { TAB = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); sessionStorage.setItem("tlav.tab", TAB); } } catch (e) {}
  const TABKEY = KEY + "." + TAB;
  const save = () => {
    try {
      const data = JSON.stringify(messages);
      localStorage.setItem(TABKEY, data); localStorage.setItem(KEY, data);
      const idx = JSON.parse(localStorage.getItem(KEY + ".tabs") || "{}"); idx[TAB] = Date.now();
      const keep = Object.entries(idx).sort((a, b) => b[1] - a[1]);
      keep.slice(10).forEach(([id]) => { localStorage.removeItem(KEY + "." + id); delete idx[id]; });
      localStorage.setItem(KEY + ".tabs", JSON.stringify(idx));
    } catch (e) { /* private mode or full storage: the chat still works, it just isn't kept */ }
  };
  const load = () => {
    try {
      const raw = localStorage.getItem(TABKEY) ?? localStorage.getItem(KEY) ?? "[]";
      const m = JSON.parse(raw); return Array.isArray(m) ? m : [];
    } catch (e) { return []; }
  };

  // ---------- rendering
  const log = $("log"), scroller = $("scroller");
  const atBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  const toBottom = (force) => { if (force || atBottom()) scroller.scrollTop = scroller.scrollHeight; };

  const empty = () => {
    const d = el("div", "empty");
    const m = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    m.setAttribute("viewBox", "0 0 4 4"); m.setAttribute("class", "mark"); m.setAttribute("aria-hidden", "true");
    let px = "";
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const hot = y < 2 && x >= 2;
      px += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${hot ? "var(--pixel)" : "var(--ink)"}" style="animation-delay:${((x + y) * 45 + (hot ? 260 : 0))}ms"/>`;
    }
    m.innerHTML = px; d.appendChild(m);
    d.appendChild(el("h1", null, "Your old computer can think."));
    d.appendChild(el("p", null, `${cfg.model || "Your model"} runs here, offline. Nothing you type leaves ${cfg.where}.`));
    return d;
  };
  const meBubble = (text) => el("div", "me", text);
  const aiBlock = () => {
    const wrap = el("div", "ai");
    const head = el("div", "head");
    const m = svg("mark");
    head.append(m, el("b", null, "Tlav"), el("span", "verb"), el("span", "secs"));
    const text = el("div", "text");
    const meta = el("div", "meta");
    wrap.append(head, text, meta);
    return { wrap, head, mark: m, verb: head.querySelector(".verb"), secs: head.querySelector(".secs"), text, meta };
  };
  // Copy sits inside the answer bubble, top right (pixel icon; "Copied" for a moment after a click)
  const COPY_ICON = '<svg viewBox="0 0 8 8" aria-hidden="true"><path fill="currentColor" d="M2 0h6v6H6V5h1V1H3v1H2zM0 2h6v6H0zM1 3v4h4V3z"/></svg>';
  const copyBtn = (getText) => {
    const b = el("button", "copy"); b.type = "button"; b.title = "Copy"; b.setAttribute("aria-label", "Copy answer");
    b.innerHTML = COPY_ICON + '<span class="copy-label">Copy</span>';
    const lbl = b.querySelector(".copy-label");
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(getText()); lbl.textContent = "Copied"; b.classList.add("done"); }
      catch (e) {
        lbl.textContent = "Select to copy";
        const r = document.createRange(); r.selectNodeContents(b.parentElement); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      setTimeout(() => { lbl.textContent = "Copy"; b.classList.remove("done"); }, 1500);
    });
    return b;
  };
  const render = () => {
    log.textContent = "";
    const shown = messages.filter((m) => m.role !== "system");
    if (!shown.length) { log.appendChild(empty()); return; }
    for (const m of shown) {
      if (m.role === "user") { log.appendChild(meBubble(m.content)); continue; }
      const a = aiBlock();
      a.text.innerHTML = md(m.content);
      if (m.stats) a.meta.appendChild(el("span", null, m.stats));
      a.text.appendChild(copyBtn(() => m.content));
      log.appendChild(a.wrap);
    }
    toBottom(true);
  };

  // ---------- <think> tags inside the answer text (some models, older servers)
  const splitter = () => {
    let buf = "", inside = false;
    return (chunk) => {
      buf += chunk; const out = [];
      for (;;) {
        const tag = inside ? "</think>" : "<think>", i = buf.indexOf(tag);
        if (i >= 0) { if (i) out.push([inside ? "think" : "answer", buf.slice(0, i)]); buf = buf.slice(i + tag.length); inside = !inside; continue; }
        let keep = 0; for (let k = Math.min(tag.length - 1, buf.length); k > 0; k--) if (tag.startsWith(buf.slice(-k))) { keep = k; break; }
        const emit = buf.slice(0, buf.length - keep);
        if (emit) out.push([inside ? "think" : "answer", emit]);
        buf = buf.slice(emit.length); return out;
      }
    };
  };

  // ---------- keep the conversation inside the model's memory
  const tokens = (ms) => ms.reduce((n, m) => n + Math.ceil((m.content || "").length / 3.5) + 4, 0);
  const fit = (ms, reserve) => {
    const sys = ms[0] && ms[0].role === "system" ? [ms[0]] : [];
    let rest = ms.slice(sys.length).map(({ role, content }) => ({ role, content }));
    let dropped = 0;
    while (rest.length > 1 && tokens(sys.concat(rest)) > Math.max(256, cfg.ctx - reserve)) {
      const n = rest.length > 2 && rest[0].role === "user" && rest[1].role === "assistant" ? 2 : 1;
      rest = rest.slice(n); dropped += n;
    }
    return { prompt: sys.concat(rest), dropped };
  };

  // ---------- ask
  const send = async (text) => {
    if (!text.trim() || busy) return;
    if (!messages.some((m) => m.role !== "system")) log.textContent = "";
    messages.push({ role: "user", content: text });
    save();
    log.appendChild(meBubble(text));
    const a = aiBlock();
    log.appendChild(a.wrap);
    toBottom(true);

    // thinking: the square moves and old-computer words rotate until the first word arrives
    const t0 = performance.now();
    const verbs = cfg.verbs.slice().sort(() => Math.random() - .5);
    let vi = 0, phase = "wait";
    a.mark.classList.add("moving");
    a.verb.textContent = verbs[0] + "…";
    const tick = setInterval(() => {
      const s = Math.floor((performance.now() - t0) / 1000);
      if (phase !== "write") { a.secs.textContent = (s ? s + "s" : "") + (thoughts ? ` · thinking, ${thoughts} tokens` : ""); vi = Math.floor((performance.now() - t0) / 2800) % verbs.length; a.verb.textContent = verbs[vi] + "…"; }
    }, 250);
    const pen = svg("pen moving");
    let answer = "", reasoning = "", thinkBox = null, thinkText = null, n = 0, timings = null, first = 0, thoughts = 0;
    const room0 = Math.max(256, Math.min(2048, Math.floor(cfg.ctx / 2)));
    const reserve = think && cfg.reasons ? Math.max(room0, Math.floor(cfg.ctx / 2)) : room0;
    const { prompt, dropped } = fit(messages, reserve);
    if (dropped) a.meta.appendChild(el("span", null, `oldest ${dropped} messages left out to make room`));
    // a single message bigger than the model's memory: keep its start and end
    const shorten = (s, maxTok, cpt) => { const keep = Math.max(200, Math.floor(maxTok * cpt)); if (s.length <= keep) return s; const h = Math.floor(keep * .7); return s.slice(0, h) + "\n\n[… the middle of this message was left out to fit the model's memory …]\n\n" + s.slice(s.length - (keep - h)); };
    const room = cfg.ctx - reserve - tokens(prompt.slice(0, -1)) - 16;
    if (tokens(prompt.slice(-1)) > room) {
      prompt[prompt.length - 1] = { role: "user", content: shorten(prompt[prompt.length - 1].content, room, 3) };
      a.meta.appendChild(el("span", null, "your message was longer than the model can hold; Tlav kept its start and end"));
    }

    let writeAt = 0, liveTimer = null;
    const live = el("span", "live");
    const showLive = () => {
      const secs = (performance.now() - writeAt) / 1000;
      live.textContent = `${n} tokens · ${(n / Math.max(secs, .5)).toFixed(1)} tokens/s · ${Math.floor(secs)}s`;
    };
    const startWriting = () => {
      if (phase === "write") return;
      phase = "write"; writeAt = performance.now();
      a.meta.prepend(live); setTimeout(showLive, 0); liveTimer = setInterval(showLive, 1000);   // speed, updated every second
      a.mark.classList.remove("moving");
      a.verb.textContent = ""; a.secs.textContent = "";
      a.text.textContent = ""; a.text.appendChild(el("span")); a.text.appendChild(pen);
    };
    const showThinking = (chunk) => {
      reasoning += chunk; thoughts++;
      if (!thinkBox) {   // collapsed: the status line shows progress, the text is one click away
        thinkBox = el("details", "think");
        thinkBox.appendChild(el("summary", null, "Thinking…"));
        thinkText = el("div"); thinkBox.appendChild(thinkText);
        a.wrap.insertBefore(thinkBox, a.text);
      }
      thinkText.textContent = reasoning;
    };
    const feed = splitter();
    const ctrl = new AbortController();
    busy = ctrl; setBusy(true);
    let error = "", finished = false, hitLimit = false;
    try {
      const body = { messages: prompt, stream: true, temperature, max_tokens: reserve };
      if (cfg.reasons) body.chat_template_kwargs = { enable_thinking: think };
      const post = () => fetch("v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctrl.signal });
      let res = await post();
      if (res.status === 400) {   // still too long (the estimate was low): try once with half
        prompt[prompt.length - 1] = { role: "user", content: shorten(prompt[prompt.length - 1].content, Math.max(64, Math.floor(room / 2)), 2) };
        res = await post();
        if (res.status === 400) throw new Error("that message is too long for this model's memory. Shorten it or send it in parts");
      }
      if (!res.ok || !res.body) throw new Error(`the model answered ${res.status}`);
      const reader = res.body.getReader(), dec = new TextDecoder();
      let rest = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        rest += dec.decode(value, { stream: true });
        const lines = rest.split("\n"); rest = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          let j; try { j = JSON.parse(data); } catch (e) { continue; }
          if (j.timings) timings = j.timings;
          if (j.choices && j.choices[0] && j.choices[0].finish_reason) { finished = true; hitLimit = j.choices[0].finish_reason === "length"; }
          const d = j.choices && j.choices[0] && j.choices[0].delta;
          if (!d) continue;
          const parts = [];
          if (d.reasoning_content) parts.push(["think", d.reasoning_content]);
          if (d.content) parts.push(...feed(d.content));
          for (const [kind, chunk] of parts) {
            if (!first) first = performance.now();
            if (kind === "think") { showThinking(chunk); continue; }
            if (!answer && !chunk.trim()) continue;
            startWriting();
            answer += chunk; n++;
            a.text.firstChild.innerHTML = md(answer);
          }
          toBottom();
        }
      }
    } catch (e) {
      if (e.name !== "AbortError") error = /too long/.test(e.message || "") ? "That message is too long for this model's memory. Shorten it or send it in parts."
        : "The model isn't answering (" + (e.message || e) + "). " + restartHint;
    }
    if (!error && !finished && !ctrl.signal.aborted && (answer || reasoning)) error = "The answer was cut off: the model stopped responding. " + restartHint;
    else if (!error && hitLimit && answer) a.meta.appendChild(el("span", null, "reached its length limit; ask it to continue"));
    clearInterval(tick); clearInterval(liveTimer); live.remove();
    busy = null; setBusy(false);
    { const r = a.wrap.getBoundingClientRect(); if (answer) fxRipple(r.left + 20, r.top + 10, .6); }
    pen.remove(); a.mark.classList.remove("moving"); a.verb.textContent = ""; a.secs.textContent = "";
    if (thinkBox) { thinkBox.firstChild.textContent = `Thought for ${Math.max(1, Math.round(((writeAt || performance.now()) - t0) / 1000))}s`; }
    answer = answer.trim();
    a.text.innerHTML = md(answer);
    if (error) a.meta.appendChild(el("span", "error", error));
    if (answer) {
      const secs = (performance.now() - t0) / 1000;
      const tok = timings ? timings.predicted_n : n;
      const tps = timings && timings.predicted_per_second ? timings.predicted_per_second : (first ? n / Math.max(.01, (performance.now() - first) / 1000) : 0);
      const stats = `${tok} tokens · ${tps.toFixed(1)} tokens/s · ${secs.toFixed(1)}s${ctrl.signal.aborted ? " · stopped" : ""}`;
      a.meta.prepend(el("span", null, stats));
      a.text.appendChild(copyBtn(() => answer));
      messages.push({ role: "assistant", content: answer, stats });
    } else {
      messages.pop();   // nothing came back: keep the question out of the history
      if (!error) a.meta.appendChild(el("span", null, reasoning && !ctrl.signal.aborted
        ? "It used all its room thinking and never got to the answer. Turn Reasoning off for a direct answer."
        : "No answer."));
    }
    save();
    toBottom();
  };

  // ---------- controls
  const input = $("input"), btn = $("send");
  const label = btn.querySelector(".label");
  const setBusy = (on) => {
    fxBusy = on; label.textContent = on ? "Stop" : "Send"; btn.setAttribute("aria-label", on ? "Stop" : "Send");
    btn.classList.toggle("stop", on); btn.type = on ? "button" : "submit"; refresh();
  };
  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, innerHeight * .4) + "px"; };
  // the box reacts as you type: send lights up, a rough token count appears, examples step aside
  const ghost = $("ghost"), count = $("count");
  const refresh = () => {
    const v = input.value.trim();
    btn.classList.toggle("ready", !!v && !busy);
    count.textContent = v ? `~${Math.max(1, Math.ceil(v.length / 3.5))} tokens` : "";
    count.classList.toggle("on", !!v);
    ghost.classList.toggle("hide", !!input.value);
  };
  const EXAMPLES = ["Ask anything", "Explain RAM like I'm ten", "Give me three dinner ideas", "Summarise a long email", "Why do old computers feel slow?", "Write a short birthday message"];
  let ex = 0;
  ghost.textContent = EXAMPLES[0];
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => {
    if (input.value) return;        // never move while there's text in the box
    ghost.classList.add("out");
    setTimeout(() => { ex = (ex + 1) % EXAMPLES.length; ghost.textContent = EXAMPLES[ex]; ghost.classList.remove("out"); }, 450);
  }, 3600);
  input.addEventListener("input", () => { grow(); refresh(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault(); if (busy || !input.value.trim()) return;
    const t = input.value; input.value = ""; grow(); refresh();
    const r = $("compose").getBoundingClientRect(); fxRipple(r.left + r.width / 2, r.top, 1);
    send(t);
  });
  btn.addEventListener("click", () => { if (busy) busy.abort(); });
  $("newChat").addEventListener("click", () => { if (busy) busy.abort(); messages = messages.filter((m) => m.role === "system"); save(); render(); input.focus(); });
  $("think").addEventListener("change", (e) => { think = e.target.checked; try { localStorage.setItem("tlav.think", think ? "1" : "0"); } catch (x) {} });

  // ---------- white or dark: follows the system until the button picks one (remembered)
  const rootEl = document.documentElement, darkMq = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => rootEl.dataset.theme ? rootEl.dataset.theme === "dark" : darkMq.matches;
  const themeShown = () => {
    rootEl.classList.toggle("dark-now", isDark());
    $("themeBtn").setAttribute("aria-label", isDark() ? "Switch to white" : "Switch to dark mode");
  };
  try { const saved = localStorage.getItem("tlav.chat.theme"); if (saved === "dark" || saved === "light") rootEl.dataset.theme = saved; } catch (e) {}
  $("themeBtn").addEventListener("click", () => {
    rootEl.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("tlav.chat.theme", rootEl.dataset.theme); } catch (e) {}
    themeShown();
  });
  if (darkMq.addEventListener) darkMq.addEventListener("change", themeShown);
  themeShown();

  // ---------- background: slow pixel field, kept clear of the reading column
  (() => {
    const c = $("fx"), g = c.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const GAP = 22, SZ = 5;
    let W = 0, H = 0, cells = [], motes = [], colA = "#7aa886", colB = "#f26b3a", energy = 0, lastT = 0, prevT = 0;
    const mote = (y) => ({ x: Math.random() * W, y: y ?? H + Math.random() * 40, s: 2 + Math.round(Math.random() * 4),
      v: 7 + Math.random() * 14, ph: Math.random() * 6.28, sway: 6 + Math.random() * 16, hot: Math.random() < .14 });
    const token = (v, d) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || d;
    const build = () => {
      // The pixels are blocky on purpose, so the canvas runs at half resolution and is scaled up
      // crisp: a quarter of the screen pixels to repaint each frame, and it looks the same.
      const k = .5;
      W = innerWidth; H = innerHeight; c.width = Math.ceil(W * k); c.height = Math.ceil(H * k); g.setTransform(k, 0, 0, k, 0, 0);
      colA = token("--fx-a", colA); colB = token("--fx-b", colB);
      cells = [];
      // Only pixels that can ever show: the ones fully faded behind the text are never computed.
      // Fixed per-pixel values are worked out once here, not every frame.
      for (let y = GAP / 2; y < H; y += GAP) for (let x = GAP / 2; x < W; x += GAP) {
        const e = side(x);
        if (Math.random() < .55 && e >= .02)
          cells.push({ x, y, e, k: x * .008 + y * .006, ph: Math.random() * 6.28, sp: .15 + Math.random() * .25, hot: Math.random() < .06 });
      }
      cells.sort((a, b) => a.hot - b.hot);          // one colour switch per frame instead of hundreds
      motes = Array.from({ length: W < 700 ? 22 : 46 }, () => mote(Math.random() * H));
    };
    const snap = (v) => Math.round(v / 2) * 2;   // whole canvas pixels at half resolution: crisp squares
    const side = (x) => {   // 0 behind the text column, 1 out at the edges
      const half = Math.min(420, W * .38), d = Math.abs(x - W / 2) - half;
      return Math.max(0, Math.min(1, d / 160 + (W < 700 ? .3 : 0)));
    };
    const draw = (t) => {
      const s = t / 1000;
      energy += ((fxBusy ? 1 : 0) - energy) * .03;          // a little brighter while it writes
      g.clearRect(0, 0, W, H);
      while (ripples.length && t - ripples[0].t0 > 2600) ripples.shift();
      const rip = ripples.map((r) => ({ x: r.x, y: r.y, front: (t - r.t0) * .42, fade: (1 - (t - r.t0) / 2600) * r.k }));
      let fill = "";
      for (const p of cells) {
        let boost = 0;
        for (const r of rip) {                         // ring 70px wide, moving 420px per second
          const d = Math.hypot(p.x - r.x, p.y - r.y) - r.front;
          if (d > -150 && d < 150) boost = Math.max(boost, Math.exp(-(d * d) / 2400) * r.fade);
        }
        const wave = .5 + .5 * Math.sin(p.k - s * .35);                       // slow diagonal wave
        const tw = .5 + .5 * Math.sin(s * p.sp + p.ph);                        // gentle twinkle
        const v = Math.min(1, wave * tw + boost * .9), sz = SZ * (.55 + .6 * v);
        g.globalAlpha = Math.min(.5, (.07 + .32 * v) * (1 + energy * .7) * Math.max(p.e, boost * .5));
        const want = p.hot ? colB : colA;
        if (want !== fill) { g.fillStyle = want; fill = want; }
        const q = Math.max(2, snap(sz));
        g.fillRect(snap(p.x - q / 2), snap(p.y - q / 2), q, q);
      }
      // floating pixels: rise slowly with a gentle sway, fainter behind the conversation
      const dt = prevT ? Math.min(.1, (t - prevT) / 1000) : 0; prevT = t;
      for (const m of motes) {
        m.y -= m.v * dt * (1 + energy * .6);
        if (m.y < -10) Object.assign(m, mote());
        const x = m.x + Math.sin(s * .5 + m.ph) * m.sway;
        const life = Math.min(1, (H - m.y) / 120, (m.y + 10) / 160);          // fade in at the bottom, out at the top
        const inText = Math.abs(x - W / 2) < Math.min(420, W * .38) ? .45 : 1;
        g.globalAlpha = Math.max(0, life) * (.24 + .12 * Math.sin(s * 1.3 + m.ph)) * inText * (1 + energy * .5);
        g.fillStyle = m.hot ? colB : colA;
        g.fillRect(snap(x), snap(m.y), Math.max(2, snap(m.s)), Math.max(2, snap(m.s)));
      }
      g.globalAlpha = 1;
    };
    const loop = (t) => {
      // 20 fps is plenty for motion this slow; 10 fps while the model writes, so it gets the processor
      if (!document.hidden && t - lastT > (fxBusy ? 100 : 50)) { lastT = t; draw(t); }
      requestAnimationFrame(loop);
    };
    build();
    addEventListener("resize", build);
    new MutationObserver(build).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    const mq = matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", () => { build(); if (still) draw(4000); });
    if (still) draw(4000); else requestAnimationFrame(loop);
  })();

  // ---------- start
  const start = async () => {
    try { const r = await fetch("tlav.json", { cache: "no-store" }); if (r.ok) cfg = Object.assign(cfg, await r.json()); } catch (e) { /* plain llama-server */ }
    if (!cfg.model) {
      try { const p = await (await fetch("props")).json(); const path = p.model_path || ""; cfg.model = path.split(/[\\/]/).pop().replace(/\.gguf$/, ""); cfg.ctx = (p.default_generation_settings || {}).n_ctx || cfg.ctx; } catch (e) {}
    }
    $("model").textContent = [cfg.model, cfg.quant].filter(Boolean).join(" · ") || "local model";
    $("where").textContent = `Offline · on ${cfg.where}`;
    if (/computers/.test(cfg.where)) restartHint = "In a cluster this usually means a worker computer went offline: check `tlav cluster list`, start `tlav worker` there again, then type `tlav`.";
    if (cfg.reasons) {
      $("thinkWrap").hidden = false;
      let saved = null; try { saved = localStorage.getItem("tlav.think"); } catch (e) {}
      think = saved != null ? saved === "1" : !!cfg.think_default;   // slow PC or tiny model: answer first
      $("think").checked = think;
    }
    messages = load();
    render();
    input.focus();
  };
  start();
})();
</script>
</body>
</html>
